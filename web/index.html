<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://westar-proposal-api.tomben49999999.workers.dev; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>WESTAR · Proposal Desk</title><link rel="stylesheet" href="./style.css?v=page-nav-7"></head><body>
<header><button id="menu" aria-controls="nav-list" aria-expanded="false" aria-label="開啟提案導覽">提案</button><a class="brand" href="#">WESTAR<span>PROPOSAL DESK</span></a><nav id="nav-list" aria-label="提案導覽"></nav><div class="sidebar-bottom"><button id="theme" aria-label="切換深淺配色">切換淺色</button><div id="identity"></div><button id="logout" hidden>登出</button></div></header><button id="nav-overlay" aria-label="關閉提案導覽" hidden></button>
<main><div id="notice" role="status" aria-live="polite"></div><section id="login" class="login"><div class="eyebrow">RESEARCH → REVIEW → ACTION</div><h1>讓每份提案，<br>有一個決策的地方。</h1><p>閱讀完整研究、整理合作進度，<br>在準備好時開啟郵件。</p><div class="login-actions"><button id="signin" class="primary">使用 Google 登入</button><button id="passkey">使用 Passkey 登入</button></div><p class="small">受邀成員專用 · 登入後維持 30 天</p></section>
<section id="desk" hidden><div class="heading"><div><div class="eyebrow">YOUR PROPOSAL LIBRARY</div><h1>提案工作台</h1><p>每一份研究，保留原來的判斷。</p></div><div class="actions"><button id="register">建立 Passkey</button><button id="refresh">重新整理</button></div></div>
<div class="toolbar"><label>搜尋提案<input id="search" type="search" placeholder="客戶、活動或提案名稱"></label><label>進度<select id="filter"><option value="">所有狀態</option><option value="review">待審</option><option value="sent">已寄出</option><option value="waiting">等待回覆</option><option value="rejected">淘汰</option><option value="cooling">冷卻</option></select></label></div><div id="list" class="list"></div><p id="empty" hidden>沒有符合條件的提案。</p><p class="small" id="sync"></p></section>
<section id="detail" hidden><button id="back">← 返回列表</button><div class="heading"><div><div id="account" class="eyebrow"></div><h1 id="title"></h1><p id="meta"></p></div><label>提案狀態<select id="status"><option value="review">待審</option><option value="sent">已寄出</option><option value="waiting">等待回覆</option><option value="rejected">淘汰</option><option value="cooling">冷卻</option></select></label></div>
<div class="detail-grid"><article><div id="source-label" class="section-label">Proposal — Synced from ChatGPT</div><div class="proposal-format"><p id="source-note" class="small">內容沿用正式交付版本。</p><button id="raw-toggle" aria-pressed="false">查看原文</button></div><div id="body" class="original"></div><details><summary>版本紀錄</summary><div id="history"></div></details></article><aside id="mail-panel"><div class="section-label">預備信件</div><p id="mail-note" class="small"></p><label>收件人<input id="to" readonly></label><label>主旨<input id="subject" readonly></label><label>正文<textarea id="mailbody" readonly rows="22"></textarea></label><div class="mail-actions"><a id="mailto" class="button primary">開啟郵件</a><button id="copy">複製</button></div><p class="small">在郵件軟體確認內容後寄出。</p></aside></div></section></main><footer>WESTAR · 私有提案資料 / 受邀成員存取</footer><script type="module" src="./app.js?v=page-nav-7"></script></body></html>
